<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOP Game Lab - 4 tính chất & 6 quan hệ (C# + Canvas)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#060913;
    --panel:rgba(13,18,32,.72);
    --border:rgba(255,255,255,.09);
    --text:#e6ecf7;
    --muted:#93a0b8;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(56,130,246,.16), transparent 60%),
      radial-gradient(900px 480px at 85% 0%, rgba(168,85,247,.14), transparent 60%),
      radial-gradient(1000px 700px at 50% 115%, rgba(236,72,153,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    overflow-x:hidden;
    min-height:100%;
  }
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none;z-index:0}
  .orb.o1{width:420px;height:420px;background:#3b82f6;top:-120px;left:-100px;animation:drift1 22s ease-in-out infinite}
  .orb.o2{width:380px;height:380px;background:#a855f7;top:30%;right:-140px;animation:drift2 26s ease-in-out infinite}
  .orb.o3{width:360px;height:360px;background:#ec4899;bottom:-140px;left:30%;animation:drift3 30s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(60px,40px) scale(1.15)}}
  @keyframes drift2{50%{transform:translate(-50px,60px) scale(.9)}}
  @keyframes drift3{50%{transform:translate(70px,-50px) scale(1.1)}}

  .wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto}

  header{padding:18px 16px 4px}
  #stage-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .chip{
    --sc:#4dd0e1;
    display:flex;align-items:center;gap:8px;
    padding:6px 13px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);
    color:#8b98b3;font-size:12.5px;font-weight:600;
    transition:all .45s cubic-bezier(.2,.8,.3,1);
    user-select:none;
  }
  .chip:hover{border-color:var(--sc);color:#cdd7ea}
  .chip .num{font-family:var(--mono);font-size:11px;opacity:.75;min-width:15px;text-align:center}
  .chip.done{color:#6fe3a5;border-color:rgba(111,227,165,.35)}
  .chip.active{
    color:#fff;border-color:var(--sc);
    background:color-mix(in srgb, var(--sc) 16%, transparent);
    box-shadow:0 0 20px -4px var(--sc), inset 0 0 12px -8px var(--sc);
    transform:translateY(-2px) scale(1.04);
  }
  #timeline-row{
    max-width:920px;margin:14px auto 0;
    display:flex;align-items:center;gap:10px;
  }
  #progress{position:relative;flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:visible;cursor:pointer}
  #progress:hover{background:rgba(255,255,255,.14)}
  #tl-knob{
    position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;
    background:#fff;border:2px solid rgba(10,14,26,.65);
    transform:translate(-50%,-50%) scale(0);transition:transform .18s;
    pointer-events:none;box-shadow:0 0 10px rgba(180,190,255,.8);z-index:2;
  }
  #progress:hover #tl-knob,#progress.drag #tl-knob{transform:translate(-50%,-50%) scale(1)}
  #tl-bubble{
    position:absolute;bottom:15px;left:0;transform:translateX(-50%);
    background:#0d1424;border:1px solid rgba(255,255,255,.16);border-radius:8px;
    padding:5px 11px;font-size:12px;color:#e6ecf7;white-space:nowrap;
    opacity:0;transition:opacity .15s;pointer-events:none;
    box-shadow:0 8px 20px rgba(0,0,0,.5);z-index:3;
  }
  #tl-bubble.show{opacity:1}
  #tl-bubble b{font-family:var(--mono);font-size:11px;color:#93a0b8;margin-right:7px;font-weight:600}
  #progress-fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#4dd0e1,#a78bfa,#ff5c8a);
    box-shadow:0 0 14px rgba(140,150,255,.8);
    transition:width .3s linear;
  }
  .icon-btn{
    width:34px;height:34px;flex:none;border-radius:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);color:#cdd7ea;
    font-size:14px;line-height:1;display:grid;place-items:center;
    transition:all .25s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.12);box-shadow:0 0 12px rgba(150,160,255,.4);color:#fff}

  main{
    display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:18px;align-items:stretch;
    padding:14px clamp(12px,3vw,32px) 6px;
  }
  @media (max-width:1020px){
    main{grid-template-columns:1fr}
    #game-panel{order:-1}
  }
  .glass{
    position:relative;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.03);
  }
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  #code-filename{font-family:var(--mono);font-size:12.5px;color:#7f8ca6;margin-left:8px}
  #stage-badge{
    margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.3px;
    padding:4px 12px;border-radius:999px;color:#fff;
    background:rgba(255,255,255,.08);
    transition:all .5s;white-space:nowrap;
  }
  .live-tag{
    display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    letter-spacing:1.5px;color:#6fe3a5;margin-left:10px;
  }
  .live-tag i{width:7px;height:7px;border-radius:50%;background:#6fe3a5;animation:blink 1.2s infinite;font-style:normal}
  @keyframes blink{50%{opacity:.2}}

  #code-watermark{
    position:absolute;left:0;right:0;top:43px;bottom:96px;
    display:grid;place-items:center;
    font-family:var(--mono);font-size:54px;font-weight:800;letter-spacing:7px;
    color:rgba(185,200,255,.045);
    transform:rotate(-10deg);
    pointer-events:none;user-select:none;z-index:4;
  }
  #credit-line{
    text-align:center;padding:16px 0 18px;
    font-size:14px;font-weight:600;letter-spacing:3px;
    color:rgba(150,165,195,.26);
  }
  #code{
    position:relative;
    font-family:var(--mono);
    font-size:13px;line-height:1.6;
    padding:14px 8px 10px;
    overflow-y:auto;flex:1;min-height:360px;max-height:700px;
    background:linear-gradient(180deg, rgba(8,12,22,.55), rgba(8,12,22,0) 120px);
    scrollbar-width:thin;scrollbar-color:#2a3550 transparent;
  }
  #code::-webkit-scrollbar{width:8px}
  #code::-webkit-scrollbar-thumb{background:#222d47;border-radius:99px}
  .cl{
    display:flex;white-space:pre;padding:0 10px;
    border-left:3px solid transparent;border-radius:4px;
    transition:background .25s,border-color .25s;
  }
  .cl .ln{
    width:34px;flex:none;text-align:right;padding-right:12px;
    color:#3d4a63;font-size:12px;user-select:none;
  }
  .cl code{font-family:var(--mono);color:#dbe4f5}
  .cl.todo{opacity:0}
  .cl.typing{background:rgba(255,209,102,.08);border-left-color:#ffd166}
  .cl.done .ln::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;color:#3ddc84;font-size:10px;margin-left:5px}
  .cl.err{border-left-color:#ff5470;animation:errflash 1.4s ease}
  @keyframes errflash{
    0%,40%,80%{background:rgba(255,84,112,.22)}
    20%,60%,100%{background:rgba(255,84,112,.08)}
  }
  .caret{
    display:inline-block;width:8px;height:1.15em;vertical-align:-0.18em;
    background:#ffd166;margin-left:1px;border-radius:1px;
    animation:caret .7s steps(1) infinite;
  }
  @keyframes caret{50%{opacity:0}}
  .kw{color:#c792ea}.tp{color:#82aaff}.st{color:#c3e88d}
  .num{color:#f78c6c}.cm{color:#5b6b85;font-style:italic}
  .op{color:#89ddff}.fn{color:#ffcb6b}.pl{color:#dbe4f5}.w{color:#dbe4f5}

  #console{
    border-top:1px solid rgba(255,255,255,.07);
    height:96px;padding:9px 14px;overflow:hidden;
    font-family:var(--mono);font-size:12px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
    color:#9fb0cc;background:rgba(4,7,14,.5);
  }
  #console .ttl{font-size:10.5px;letter-spacing:1.5px;color:#5b6b85;font-weight:700;margin-bottom:2px}
  .clog{animation:slidein .3s ease}
  .clog::before{content:'> ';color:#3d4a63}
  .clog.ok{color:#7ee787}
  .clog.bad{color:#ff7b9c}
  @keyframes slidein{from{transform:translateX(-8px);opacity:0}}

  .game-body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
  canvas{
    width:100%;display:block;border-radius:12px;
    background:#0a0f1e;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);
  }
  #caption{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:12px;min-height:47px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    font-size:14px;color:#cdd7ea;line-height:1.4;
  }
  #cap-dot{
    flex:none;width:12px;height:12px;border-radius:50%;
    background:#4dd0e1;box-shadow:0 0 12px currentColor;
    transition:background .5s;
  }
  #cap-ico{flex:none;font-size:15px;width:22px;text-align:center}
  #cap-text.bump{animation:bump .35s ease}
  @keyframes bump{0%{transform:translateY(4px);opacity:.35}100%{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap">

  <header>
    <div id="stage-chips"></div>
    <div id="timeline-row">
      <div id="progress">
        <div id="progress-fill"></div>
        <div id="tl-knob"></div>
        <div id="tl-bubble"></div>
      </div>
      <button class="icon-btn" id="btn-pause" title="Tạm dừng / tiếp tục"><i class="fa-solid fa-pause"></i></button>
      <button class="icon-btn" id="btn-restart" title="Chạy lại từ đầu"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </header>

  <main>
    <section class="glass" id="code-panel">
      <div id="code-watermark">@tirumisaa</div>
      <div class="panel-head">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span id="code-filename">Main.cs</span>
        <span id="stage-badge">Sẵn sàng</span>
      </div>
      <pre id="code" aria-label="Code C#"></pre>
      <div id="console">
        <div class="ttl">RUNTIME CONSOLE</div>
      </div>
    </section>

    <section class="glass" id="game-panel">
      <div class="panel-head">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span id="code-filename">GameCanvas.cs</span>
        <span class="live-tag"><i></i>LIVE SIMULATION</span>
      </div>
      <div class="game-body">
        <canvas id="game" width="960" height="570"></canvas>
        <div id="caption">
          <span id="cap-dot"></span>
          <span id="cap-ico"></span>
          <span id="cap-text">Đang khởi động kịch bản...</span>
        </div>
      </div>
    </section>
  </main>
  <footer id="credit-line">Tirua học OOP</footer>
</div>

<script src="app.js"></script>
</body>
</html>
